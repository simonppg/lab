---
- name: Remove old OpenTofu repository
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/opentofu.sources
    state: absent

- name: Ensure workstation packages are installed
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_packages }}"
    state: present
    update_cache: true

- name: Add OpenTofu repository keys
  become: true
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - url: https://get.opentofu.org/opentofu.gpg
      dest: /etc/apt/keyrings/opentofu.gpg
    - url: https://packages.opentofu.org/opentofu/tofu/gpgkey
      dest: /etc/apt/keyrings/opentofu-repo.gpg

- name: Add OpenTofu repository
  become: true
  ansible.builtin.deb822_repository:
    name: opentofu
    types:
      - deb
    uris:
      - https://packages.opentofu.org/opentofu/tofu/any/
    suites:
      - any
    components:
      - main
    signed_by: /etc/apt/keyrings/opentofu-repo.gpg
    state: present

- name: Install OpenTofu
  become: true
  ansible.builtin.apt:
    name: tofu
    state: present
    update_cache: true

- name: Set kubectl architecture
  ansible.builtin.set_fact:
    kubectl_architecture: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64'
        }.get(ansible_facts['architecture'], ansible_facts['architecture'])
      }}

- name: Download kubectl
  become: true
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/{{ kubectl_architecture }}/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"

- name: Set Helm architecture
  ansible.builtin.set_fact:
    helm_architecture: >-
      {{
        {
          'x86_64': 'amd64',
          'aarch64': 'arm64'
        }.get(ansible_facts['architecture'], ansible_facts['architecture'])
      }}

- name: Download Helm
  become: true
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_architecture }}.tar.gz"
    dest: /tmp
    remote_src: true

- name: Install Helm
  become: true
  ansible.builtin.copy:
    src: "/tmp/linux-{{ helm_architecture }}/helm"
    dest: /usr/local/bin/helm
    mode: "0755"
    remote_src: true